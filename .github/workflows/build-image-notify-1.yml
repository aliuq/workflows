name: "Build image with Notification"

on:
  workflow_call:
    inputs:
      images:
        description: "Docker image to build"
        required: true
        type: string
      tags:
        description: "Docker image tags"
        required: true
        type: string
      labels:
        description: "Docker image labels"
        required: false
        type: string
        default: ""
      context:
        description: "Docker context"
        required: false
        type: string
        default: "."
      file:
        description: "Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      push:
        description: "Push Docker image"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Docker platforms, e.g. linux/amd64,linux/arm64"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      meta_labels:
        description: "Docker image labels on metadata"
        required: false
        type: string
      annotations:
        description: "Docker image annotations"
        required: false
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        description: "Docker Hub username"
        required: true
      DOCKERHUB_TOKEN:
        description: "Docker Hub token"
        required: true
      TOKEN:
        description: "GitHub token"
        required: true
      BOT_TOKEN:
        description: "Telegram bot token"
        required: false
      CHAT_ID:
        description: "Telegram chat ID"
        required: false
      REPLY_TO_MESSAGE_ID:
        description: "Telegram reply to message ID, means the topic id"
        required: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print inputs
        run: |
          echo -e "\033[36m#images\033[39m:\n${{ inputs.images }}"
          echo -e "\033[36m#tags\033[39m:\n${{ inputs.tags }}"
          echo -e "\033[36m#labels\033[39m:\n${{ inputs.labels }}"
          echo -e "\033[36m#context\033[39m: ${{ inputs.context }}"
          echo -e "\033[36m#file\033[39m: ${{ inputs.file }}"
          echo -e "\033[36m#push\033[39m: ${{ inputs.push }}"
          echo -e "\033[36m#platforms\033[39m: ${{ inputs.platforms }}"
          echo -e "\033[36m#meta_labels\033[39m:\n${{ inputs.meta_labels }}"
          echo -e "\033[36m#annotations\033[39m:\n${{ inputs.annotations }}"

      - name: Prepare Vars
        id: prep
        run: |
          start_time=$(date +%s)
          echo "start_time=$start_time" >> $GITHUB_OUTPUT
          echo -e "\033[36m#start_time\033[39m: $start_time"

          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ" -d '8 hour')
          echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
          echo -e "\033[36m#timestamp\033[39m: $timestamp"

          # Test readme file exist
          readme_path="${{ inputs.context }}/README.md"
          if [ -f "$readme_path" ]; then
            echo "readme=$readme_path" >> $GITHUB_OUTPUT
          fi
          echo -e "\033[36m#readme\033[39m: $readme"

          # Process images and check registry types
          build_dockerhub=false
          build_ghcr=false
          repo=""

          images=$(echo "${{ inputs.images }}" | tr ',' '\n')
          for image in $images; do
            if [[ $image =~ ^aliuq/ ]]; then
              build_dockerhub=true
              repo=$image
            elif [[ $image =~ ^ghcr.io/aliuq/ ]]; then
              build_ghcr=true
            fi
          done

          [ -n "$repo" ] && echo "repo=$repo" >> $GITHUB_OUTPUT
          echo "build_dockerhub=$build_dockerhub" >> $GITHUB_OUTPUT
          echo "build_ghcr=$build_ghcr" >> $GITHUB_OUTPUT

          # Print summary
          echo -e "\033[36m#build_dockerhub\033[39m: $([ "$build_dockerhub" = true ] && echo "✓" || echo "✗")"
          echo -e "\033[36m#build_ghcr\033[39m: $([ "$build_ghcr" = true ] && echo "✓" || echo "✗")"
          echo -e "\033[36m#repo\033[39m: $repo"

      - name: Docker meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.images }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.meta_labels }}
          annotations: ${{ inputs.annotations }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: steps.prep.outputs.build_dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: steps.prep.outputs.build_ghcr == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Build and push Docker images
      #   uses: docker/build-push-action@v6
      #   id: build
      #   with:
      #     context: ${{ inputs.context }}
      #     file: ${{ inputs.file }}
      #     platforms: ${{ inputs.platforms }}
      #     push: ${{ inputs.push }}
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: |
      #       ${{ steps.meta.outputs.labels }}
      #       ${{ inputs.labels }}

      # - name: Update README
      #   uses: peter-evans/dockerhub-description@v4
      #   if: steps.prep.outputs.readme_path != '' && inputs.push == true && steps.prep.outputs.repo != ''
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #     repository: ${{ steps.prep.outputs.repo }}
      #     readme-filepath: ${{ steps.prep.outputs.readme_path }}

      - name: Test
        if: steps.prep.outputs.readme && inputs.push == true && steps.prep.outputs.repo
        run: |
          echo "readme: ${{ steps.prep.outputs.readme }}"

      - name: End timer
        id: post_prep
        run: |
          END_TIME=$(date +%s)
          START_TIME=${{ steps.prep.outputs.start_time }}
          DURATION=$((END_TIME - START_TIME))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

          TAGS=$(echo '${{ steps.meta.outputs.tags }}' | \
            while IFS= read -r line; do \
              echo "\`$line\`"; \
            done)
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "readme: ${{ steps.prep.outputs.readme }}"

      # - name: Notify
      #   uses: aliuq/telegram-action@v1
      #   if: env.BOT_TOKEN && env.CHAT_ID
      #   env:
      #     BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      #     CHAT_ID: ${{ secrets.CHAT_ID }}
      #   with:
      #     bot_token: ${{ secrets.BOT_TOKEN }}
      #     chat_id: ${{ secrets.CHAT_ID }}
      #     reply_to_message_id: ${{ secrets.REPLY_TO_MESSAGE_ID }}
      #     message: |
      #       🎉 **Docker Image Build Notification**

      #       **Repository**: [${{ github.repository }}](https://github.com/${{ github.repository }})

      #       **Tags**:
      #       ${{ steps.post_prep.outputs.tags }}

      #       **Platforms**: `${{ inputs.platforms || 'linux/amd64' }}`
      #       **BuildTime**: `${{ steps.prep.outputs.timestamp }}`
      #       **BuildDuration**: `${{ steps.post_prep.outputs.duration }}s`

      #       [**View Action**](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      #       #build_image_notify
