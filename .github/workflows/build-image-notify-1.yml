name: "Build image with Notification"

on:
  workflow_call:
    inputs:
      images:
        description: "Docker image to build"
        required: true
        type: string
      tags:
        description: "Docker image tags"
        required: true
        type: string
      labels:
        description: "Docker image labels"
        required: false
        type: string
        default: ""
      context:
        description: "Docker context"
        required: false
        type: string
        default: "."
      file:
        description: "Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      push:
        description: "Push Docker image"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Docker platforms, e.g. linux/amd64,linux/arm64"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      meta_labels:
        description: "Docker image labels on metadata"
        required: false
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        description: "Docker Hub username"
        required: true
      DOCKERHUB_TOKEN:
        description: "Docker Hub token"
        required: true
      TOKEN:
        description: "GitHub token"
        required: true
      BOT_TOKEN:
        description: "Telegram bot token"
        required: false
      CHAT_ID:
        description: "Telegram chat ID"
        required: false
      REPLY_TO_MESSAGE_ID:
        description: "Telegram reply to message ID, means the topic id"
        required: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        id: prep
        run: |
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ" -d '8 hour')
          echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
          # Test readme file exist
          readme_path="${{ inputs.context }}/README.md"
          if [ ! -f "$readme_path" ]; then
            echo "README.md not found in $readme_path"
            echo "readme_path=''" >> $GITHUB_OUTPUT
          else
            echo "readme_path=$readme_path" >> $GITHUB_OUTPUT
          fi

      - name: Update README
        uses: peter-evans/dockerhub-description@v4
        if: steps.prep.outputs.readme_path != '' && inputs.push == true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          readme-filepath: ${{ steps.prep.outputs.readme_path }}
