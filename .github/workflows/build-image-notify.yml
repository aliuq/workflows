name: "Build image with Notification"

on:
  workflow_call:
    inputs:
      images:
        description: "Docker image to build"
        required: true
        type: string
      tags:
        description: "Docker image tags"
        required: true
        type: string
      labels:
        description: "Docker image labels"
        required: false
        type: string
        default: ""
      docker_context:
        description: "Docker context"
        required: false
        type: string
        default: "."
      docker_file:
        description: "Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      docker_push:
        description: "Push Docker image"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Docker platforms, e.g. linux/amd64,linux/arm64"
        required: false
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        description: "Docker Hub username"
        required: true
      DOCKERHUB_TOKEN:
        description: "Docker Hub token"
        required: true
      TOKEN:
        description: "GitHub token"
        required: true
      BOT_TOKEN:
        description: "Telegram bot token"
        required: false
      CHAT_ID:
        description: "Telegram chat ID"
        required: false
      REPLY_TO_MESSAGE_ID:
        description: "Telegram reply to message ID, means the topic id"
        required: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        id: prep
        run: |
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ" -d '8 hour')
          echo "timestamp=$timestamp" >> $GITHUB_OUTPUT

      - name: Docker meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.images }}
          tags: ${{ inputs.tags }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.docker_push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ inputs.labels }}

      - name: End timer
        id: post_prep
        run: |
          END_TIME=$(date +%s)
          START_TIME=${{ steps.prep.outputs.start_time }}
          DURATION=$((END_TIME - START_TIME))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

          TAGS=$(echo '${{ steps.meta.outputs.tags }}' | \
            tr '\n' ' ' | \
            sed 's/^ *//g; s/ *$//g' | \
            tr ' ' '\n' | \
            grep -v '^$' | \
            sort | \
            jq -R -s 'split("\n") | map(select(length > 0)) | tojson')
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Notify
        uses: aliuq/telegram-action@v1
        if: env.BOT_TOKEN && env.CHAT_ID
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          reply_to_message_id: ${{ secrets.REPLY_TO_MESSAGE_ID }}
          message: |
            🎉 **Docker Image Build Notification**

            **Repository**: `${{ github.repository }}`
            **Tags**: 
            ${{ join(split(steps.meta.outputs.tags, '\n') | map('`' + @ + '`'), '\n') }}

            **Platforms**: `${{ inputs.platforms || 'linux/amd64' }}`
            **Build Time**: `${{ steps.prep.outputs.timestamp }}`
            **Duration**: `${{ steps.post_prep.outputs.duration }}s`
            **Workflow**: `${{ github.workflow }}`

          buttons: |
            [
              [
                { "text": "View Action", "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" },
                { "text": "View Repo", "url": "https://github.com/${{ github.repository }}" }
              ]
            ]
