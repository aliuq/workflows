name: "Build image with Notification"

on:
  workflow_call:
    inputs:
      images:
        description: "Docker image to build"
        required: true
        type: string
      tags:
        description: "Docker image tags"
        required: true
        type: string
      labels:
        description: "Docker image labels"
        required: false
        type: string
        default: ""
      docker_context:
        description: "Docker context"
        required: false
        type: string
        default: "."
      docker_file:
        description: "Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      docker_push:
        description: "Push Docker image"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Docker platforms, e.g. linux/amd64,linux/arm64"
        required: false
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        description: "Docker Hub username"
        required: true
      DOCKERHUB_TOKEN:
        description: "Docker Hub token"
        required: true
      TOKEN:
        description: "GitHub token"
        required: true
      BOT_TOKEN:
        description: "Telegram bot token"
        required: false
      CHAT_ID:
        description: "Telegram chat ID"
        required: false
      REPLY_TO_MESSAGE_ID:
        description: "Telegram reply to message ID, means the topic id"
        required: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start timer
        id: start
        run: echo "start_time=$(date +%s)" >> $GITHUB_ENV

      - name: Docker meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.images }}
          tags: ${{ inputs.tags }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.docker_push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ inputs.labels }}

      - name: End timer
        id: end
        run: echo "end_time=$(date +%s)" >> $GITHUB_ENV

      - name: Notify
        uses: aliuq/telegram-action@v1
        if: env.BOT_TOKEN && env.CHAT_ID
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DURATION: ${{ steps.end.outputs.end_time - steps.start.outputs.start_time }}
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          reply_to_message_id: ${{ secrets.REPLY_TO_MESSAGE_ID }}
          message: |
            🎉 **Docker Image Build Notification**

            📦 **Repository**: [${{ github.repository }}](https://github.com/${{ github.repository }})

            🏷️ **Tags**:
            ${{ join(steps.meta.outputs.tags, '\n  - ') }}

            🖥️ **Platforms**:
            ${{ join(fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.platforms'], '\n  - ') }}

            📅 **Build Duration**: `${{ env.DURATION }}`
            ⚙️ **Workflow**: `${{ github.workflow }}`
            🚀 **Status**: `${{ job.status }}`
            👤 **Triggered by**: @${{ github.actor }}

            > 🔗 [View Action Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          buttons: |
            [
              [
                { "text": "View Action", "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" },
                { "text": "View Repo", "url": "https://github.com/${{ github.repository }}" }
              ]
            ]
