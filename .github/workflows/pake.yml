name: Pake Build

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be packaged"
        type: string
        required: true
      name:
        description: "Application name"
        type: string
        required: false
      platforms:
        description: "Target platforms (linux,windows,macos)"
        type: string
        default: "linux,windows,macos"
      icon:
        description: "Application icon, local path or URL"
        type: string
        required: false
      multi_arch:
        description: "Build universal binary (macOS only)"
        type: boolean
        default: false
      targets:
        description: "Linux package formats (deb,appimage,rpm)"
        type: string
        default: "deb"
      title:
        description: "App Title"
        default: ""
      win_args:
        description: "Windows specific args"
        type: string
        default: ""
      mac_args:
        description: "macOS specific args"
        type: string
        default: ""
      linux_args:
        description: "Linux specific args"
        type: string
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/github-script@v7
        id: prepare
        with:
          script: |
            const inputs = {
              url: ${{ toJson(inputs.url) }},
              name: ${{ toJson(inputs.name) }},
              platforms: ${{ toJson(inputs.platforms) }},
              icon: ${{ toJson(inputs.icon) }},
              multi_arch: ${{ toJson(inputs.multi_arch) }},
              targets: ${{ toJson(inputs.targets) }},
              title: ${{ toJson(inputs.title) }},
              winArgs: ${{ toJson(inputs.win_args) }},
              macArgs: ${{ toJson(inputs.mac_args) }},
              linuxArgs: ${{ toJson(inputs.linux_args) }}
            }

            await core.group("Inputs", () => core.info(JSON.stringify(inputs, null, 2)))

            if (!inputs.url) {
              core.setFailed(`No URL specified, exiting...`)
              return
            }
              
            const platforms = inputs?.platforms?.split(',').map(s => s.trim())
            if (!platforms?.length) {
              core.setFailed(`No platforms specified, exiting...`)
              return
            }

            const platformsMap = {
              linux: { os: "ubuntu-latest", rust: "stable", target: "x86_64-unknown-linux-musl" },
              windows: { os: "windows-latest", rust: "stable-x86_64-msvc", target: "x86_64-pc-windows-msvc" },
              macos: { os: "macos-latest", rust: "stable", target: "x86_64-apple-darwin" }
            }
            const matrixMap = new Map()

            for (const platform of platforms) {
              const config = platformsMap[platform]
              if (!config) {
                core.warning(`No configuration found for platform: ${platform}`)
                continue
              }
              
              config.platform = platform
              config.multi_arch = platform === 'macos' && inputs.multi_arch

              const params = [inputs.url]
              inputs.name && params.push('--name', inputs.name)
              inputs.icon && params.push('--icon', inputs.icon)
              inputs.title && params.push('--title', inputs.title)

              if (platform === 'linux') {
                inputs.targets && params.push('--targets', inputs.targets)
                inputs.linuxArgs && params.push(inputs.linuxArgs)
              }
              else if (platform === 'macos') {
                inputs.multi_arch && params.push('--multi-arch')
                inputs.macArgs && params.push(inputs.macArgs)
              }
              else if (platform === 'windows') {
                inputs.winArgs && params.push(inputs.winArgs)
              }

              config.params = params.join(' ')

              matrixMap.set(platform, config)
            }

            const matrixIncludes = Array.from(matrixMap.values())

            await core.group("Matrix", () => core.info(JSON.stringify(matrixIncludes, null, 2)))

            core.setOutput("matrix", JSON.stringify({ include: matrixIncludes }))

  run:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    if: needs.prepare.outputs.matrix
    strategy:
      matrix: ${{ needs.prepare.outputs.matrix && fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout Pake
        uses: actions/checkout@v4
        with:
          repository: tw93/Pake
          ref: main

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}

      - name: Add ARM64 target for macOS universal binary
        if: matrix.multi_arch
        run: rustup target add aarch64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: libsoup-3.0-dev libdbus-1-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev gnome-video-effects gnome-video-effects-extra
          version: 1.1

      - name: Restore Rust cache
        uses: actions/cache/restore@v4.2.0
        id: rust_cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            node_modules/pake-cli/src-tauri/target/
          key: ${{ matrix.platform }}-rust-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ matrix.platform }}-rust-
            rust-

      - name: Install pake-cli
        run: npm install pake-cli@latest --prefer-offline --no-audit --no-fund

      - name: Build application
        timeout-minutes: 20
        shell: bash
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: 1
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: 1
        run: |
          echo "Building: node_modules/pake-cli/dist/cli.js ${{ matrix.params }}"
          node_modules/pake-cli/dist/cli.js ${{ matrix.params }}
          rm node_modules/pake-cli/src-tauri/**/.pake -rf

      - name: Collect and upload artifacts
        shell: bash
        run: |
          # 创建统一收集目录
          mkdir -p release-artifacts

          # 收集标准 Tauri 构建产物
          BUNDLE_PATH="node_modules/pake-cli/src-tauri/target/${{ matrix.target }}/release/bundle"
          OUTPUT_PATH="node_modules/pake-cli/output"

          # 根据平台收集相应文件
          case "${{ matrix.platform }}" in
            windows)
              find "$BUNDLE_PATH" -name "*.msi" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$BUNDLE_PATH" -name "*.exe" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$OUTPUT_PATH" -name "*.msi" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$OUTPUT_PATH" -name "*.exe" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              ;;
            linux)
              find "$BUNDLE_PATH" -name "*.deb" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$BUNDLE_PATH" -name "*.rpm" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$BUNDLE_PATH" -name "*.AppImage" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$OUTPUT_PATH" -name "*.deb" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$OUTPUT_PATH" -name "*.rpm" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$OUTPUT_PATH" -name "*.AppImage" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              ;;
            macos)
              find "$BUNDLE_PATH" -name "*.dmg" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$BUNDLE_PATH" -name "*.app" -exec cp -r {} release-artifacts/ \; 2>/dev/null || true
              find "$OUTPUT_PATH" -name "*.dmg" -exec cp {} release-artifacts/ \; 2>/dev/null || true
              find "$OUTPUT_PATH" -name "*.app" -exec cp -r {} release-artifacts/ \; 2>/dev/null || true
              ;;
          esac

          # 检查收集结果
          echo "Collected files:"
          ls -la release-artifacts/ || echo "No files collected"

          # 如果没有文件，尝试查找所有可能的产物
          if [ ! "$(ls -A release-artifacts/)" ]; then
            echo "No standard artifacts found, searching all directories..."
            find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app" \)
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name || 'pake-app' }}-${{ matrix.platform }}
          path: release-artifacts/
          retention-days: 3
          if-no-files-found: warn

      - name: Save Rust cache
        uses: actions/cache/save@v4.2.0
        if: steps.rust_cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            node_modules/pake-cli/src-tauri/target/
          key: ${{ matrix.platform }}-rust-${{ hashFiles('**/package-lock.json') }}
