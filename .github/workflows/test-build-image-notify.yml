name: Build image with Notification(Test)

on:
  workflow_call:
    inputs:
      images:
        description: "Docker image to build"
        required: true
        type: string
      tags:
        description: "Docker image tags"
        required: true
        type: string
      labels:
        description: "Docker image labels"
        required: false
        type: string
        default: ""
      context:
        description: "Docker context"
        required: false
        type: string
        default: "."
      file:
        description: "Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      push:
        description: "Push Docker image"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Docker platforms, e.g. linux/amd64,linux/arm64"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      meta_labels:
        description: "Docker image labels on metadata"
        required: false
        type: string
      annotations:
        description: "Docker image annotations"
        required: false
        type: string
      notify:
        description: "Notify"
        required: false
        type: boolean
        default: true
      readme_path:
        description: "Readme file path"
        required: false
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        description: "Docker Hub username"
        required: true
      DOCKERHUB_TOKEN:
        description: "Docker Hub token"
        required: true
      TOKEN:
        description: "GitHub token"
        required: true
      BOT_TOKEN:
        description: "Telegram bot token"
        required: false
      CHAT_ID:
        description: "Telegram chat ID"
        required: false
      REPLY_TO_MESSAGE_ID:
        description: "Telegram reply to message ID, means the topic id"
        required: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Resolve
        uses: aliuq/script-action@v1.0.2
        with:
          packages: kolorist
          script: |
            import { cyan } from 'kolorist'

            console.log(`cyan('#images:')\n${{ inputs.images }}`)

      - name: Print inputs
        run: |
          echo -e "\033[36m#images\033[39m:\n${{ inputs.images }}"
          echo -e "\033[36m#tags\033[39m:\n${{ inputs.tags }}"
          echo -e "\033[36m#labels\033[39m:\n${{ inputs.labels }}"
          echo -e "\033[36m#context\033[39m: ${{ inputs.context }}"
          echo -e "\033[36m#file\033[39m: ${{ inputs.file }}"
          echo -e "\033[36m#push\033[39m: ${{ inputs.push }}"
          echo -e "\033[36m#notify\033[39m: ${{ inputs.notify }}"
          echo -e "\033[36m#readme_path\033[39m: ${{ inputs.readme_path }}"
          echo -e "\033[36m#platforms\033[39m: ${{ inputs.platforms }}"
          echo -e "\033[36m#meta_labels\033[39m:\n${{ inputs.meta_labels }}"
